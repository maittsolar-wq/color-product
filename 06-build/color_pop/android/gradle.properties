org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# PASS 5: the Kotlin incremental compiler's cache path-relativization
# throws ("this and base files have different roots") when a plugin's
# Kotlin sources (pub cache, here on C:) and the project build dir (here on
# D:) sit on different Windows drive letters -- a known upstream Kotlin
# Gradle plugin limitation, not a project bug. Disabling incremental
# compilation avoids that code path entirely (full recompiles are slower
# but always correct).
kotlin.incremental=false
