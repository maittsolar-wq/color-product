appId: com.example.coloringapp
---
- launchApp:
    clearState: true

- assertVisible:
    id: home-screen

- tapOn:
    id: drawing-card-draw_animals_001

- assertVisible:
    id: drawing-preview

- tapOn:
    id: start-coloring

- assertVisible:
    id: coloring-canvas

# Select Fill
- tapOn:
    id: tool-fill

# Fill requires stable coordinates/test hook in native app.
# Example optional action:
# - tapOn:
#     point: "50%,50%"

# Back and resume flow depends on native navigation semantics.
